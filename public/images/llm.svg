<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Brain outline -->
  <circle cx="50" cy="50" r="30" stroke="white" stroke-width="3" fill="none"/>
  <!-- Neural connections -->
  <circle cx="50" cy="28" r="4" fill="white"/>
  <circle cx="72" cy="43" r="4" fill="white"/>
  <circle cx="72" cy="63" r="4" fill="white"/>
  <circle cx="50" cy="73" r="4" fill="white"/>
  <circle cx="28" cy="63" r="4" fill="white"/>
  <circle cx="28" cy="43" r="4" fill="white"/>
  <circle cx="50" cy="50" r="5" fill="#ef4444"/>
  <!-- Connections to center -->
  <line x1="50" y1="28" x2="50" y2="45" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <line x1="72" y1="43" x2="55" y2="50" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <line x1="72" y1="63" x2="55" y2="53" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <line x1="50" y1="73" x2="50" y2="55" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <line x1="28" y1="63" x2="45" y2="53" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <line x1="28" y1="43" x2="45" y2="50" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <!-- Cross connections -->
  <line x1="50" y1="28" x2="72" y2="43" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="72" y1="43" x2="72" y2="63" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="72" y1="63" x2="50" y2="73" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="73" x2="28" y2="63" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="28" y1="63" x2="28" y2="43" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="28" y1="43" x2="50" y2="28" stroke="white" stroke-width="1" opacity="0.4"/>
</svg>
